<!DOCTYPE html>
<html>

<head>
    <title>Driver Registration | RPV Water Delivery</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg,
                    #003b73,
                    #0077b6);
        }


        .container {

            width: 90%;
            max-width: 400px;

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 10px 25px rgba(0, 0, 0, 0.3);

        }


        h2 {

            text-align: center;
            color: #003b73;

            margin-bottom: 10px;

        }


        .driver-name {

            text-align: center;

            background: #eaf6ff;

            padding: 10px;

            border-radius: 8px;

            margin-bottom: 20px;

            font-weight: bold;

            color: #00509d;

        }



        label {

            font-weight: bold;

            display: block;

            margin-top: 15px;

        }



        input {

            width: 100%;

            padding: 12px;

            margin-top: 5px;

            border-radius: 8px;

            border: 1px solid #ccc;

            font-size: 16px;

        }



        button {

            width: 100%;

            padding: 13px;

            margin-top: 25px;

            background: #00509d;

            color: white;

            border: none;

            border-radius: 8px;

            font-size: 17px;

            cursor: pointer;

        }



        button:hover {

            background: #003b73;

        }



        .logo {

            text-align: center;

            font-size: 25px;

            font-weight: bold;

            color: #0077b6;

            margin-bottom: 15px;

        }
    </style>

</head>


<body>


    <div class="container">


        <div class="logo">
            RPV Water Delivery
        </div>


        <h2>
            Driver Registration
        </h2>


        <div class="driver-name">

            Driver:
            {{ driver_name }}

        </div>



        <form method="POST">


            <label>
                Username
            </label>

            <input type="text" name="username" placeholder="Enter username" required>



            <label>
                Password
            </label>


            <input type="password" name="password" placeholder="Enter password" required>



            <label>
                Confirm Password
            </label>


            <input type="password" name="confirm_password" placeholder="Confirm password" required>



            <button type="submit">

                Create Account

            </button>


        </form>



    </div>


</body>

</html>
