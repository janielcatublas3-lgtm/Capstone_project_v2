<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Login</title>

    <style>
        body {
            margin: 0;
            font-family: Segoe UI;
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 350px;
            backdrop-filter: blur(15px);
        }

        input,
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
        }

        button {
            background: #10b981;
            color: white;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>🚚 Driver Login</h2>

        <form method="POST" action="/driver_login">
            <input name="code" placeholder="Enter Driver Code" required>
            <button type="submit">Login</button>
        </form>

    </div>

</body>

</html>
