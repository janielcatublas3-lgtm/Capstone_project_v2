<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <title>Water Station Admin</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #0f172a, #1e3a8a, #3b82f6);
        }

        /* Animated background */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.2), transparent 70%);
            animation: moveBg 20s linear infinite;
            z-index: 0;
        }

        @keyframes moveBg {
            0% {
                transform: translate(0, 0);
            }

            50% {
                transform: translate(-25%, -25%);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        /* bubbles */
        .bubble {
            position: absolute;
            bottom: -120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(59, 130, 246, 0.3));
            box-shadow: 0 0 15px rgba(147, 197, 253, 0.6);
            animation: rise linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes rise {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            100% {
                transform: translateY(-120vh) translateX(40px) scale(1.2);
                opacity: 0;
            }
        }

        /* login card */
        .login-container {
            position: relative;
            z-index: 2;
            width: 360px;
            padding: 35px;
            border-radius: 20px;
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
            margin: auto;
            top: 50%;
            transform: translateY(-50%);
            animation: popIn 1s ease forwards;
        }

        @keyframes popIn {
            from {
                transform: translateY(-50%) scale(0.9);
            }

            to {
                transform: translateY(-50%) scale(1);
            }
        }

        h2 {
            color: white;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 14px;
            margin-bottom: 20px;
            color: #cbd5e1;
        }

        .error {
            color: #f87171;
            display: none;
        }

        .success {
            color: #4ade80;
            display: none;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid #ccc;
            border-top: 3px solid #1e3a8a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 10px auto;
            display: none;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }

        #googleSignIn {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <!-- bubbles -->
    <script>
        function createBubbles() {
            for (let i = 0; i < 30; i++) {
                let bubble = document.createElement("div");
                bubble.classList.add("bubble");

                let size = Math.random() * 60 + 10;
                bubble.style.width = size + "px";
                bubble.style.height = size + "px";
                bubble.style.left = Math.random() * 100 + "%";
                bubble.style.animationDuration = (Math.random() * 6 + 4) + "s";
                bubble.style.animationDelay = Math.random() * 5 + "s";

                document.body.appendChild(bubble);
            }
        }

        window.addEventListener("load", () => {
            createBubbles();
        });
    </script>

    <!-- LOGIN CARD -->
    <div class="login-container">

        <h2>💧 RPV Water Delivery</h2>
        <div class="subtitle">Secure Admin Access</div>

        <div id="googleSignIn"></div>

        <div class="spinner" id="loading"></div>
        <div class="error" id="error">Invalid login</div>
        <div class="success" id="success">Access granted!</div>

    </div>

    <script>
        // GOOGLE LOGIN CALLBACK
        function handleCredentialResponse(response) {
            const form = document.createElement("form");
            form.method = "POST";
            form.action = "/google-auth";

            const input = document.createElement("input");
            input.type = "hidden";
            input.name = "token";
            input.value = response.credential;

            form.appendChild(input);
            document.body.appendChild(form);
            form.submit();
        }

        // INIT GOOGLE LOGIN
        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "737562037990-n21m7uc217rhihqs83r5j5hene4b2jf6.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });

            google.accounts.id.renderButton(
                document.getElementById("googleSignIn"),
                { theme: "outline", size: "large", width: 250 }
            );
        };
    </script>

</body>

</html>
